<!DOCTYPE html>\n<html lang="en">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>Valentine's Day</title>\n    <style>\n        body {\n            background: linear-gradient(135deg, pink, purple);\n            display: flex;\n            flex-direction: column;\n            justify-content: center;\n            align-items: center;\n            height: 100vh;\n            color: white;\n            font-family: 'Arial', sans-serif;\n        }\n        h1 {\n            background: linear-gradient(90deg, pink, purple);\n            -webkit-background-clip: text;\n            -webkit-text-fill-color: transparent;\n        }\n        button {\n            padding: 10px 20px;\n            margin: 10px;\n            font-size: 16px;\n            cursor: pointer;\n            border: none;\n            border-radius: 5px;\n            transition: background-color 0.3s;\n        }\n        #yes {\n            background-color: green;\n        }\n        #no {\n            background-color: red;\n        }\n    </style>\n</head>\n<body>\n    <h1>Will you be my Valentine? 💖</h1>\n    <button id="yes">Yes</button>\n    <button id="no">No</button>\n    <script>\n        document.getElementById('yes').addEventListener('click', function() {\n            alert('Yay! Let’s celebrate this Valentine’s Day!');\n        });\n        document.getElementById('no').addEventListener('click', function() {\n            let noButton = this;\n            noButton.style.position = 'absolute';\n            noButton.style.transition = 'transform 0.5s';\n            let moveButton = setInterval(function() {\n                let x = Math.random() * window.innerWidth;\n                let y = Math.random() * window.innerHeight;\n                noButton.style.transform = 'translate(' + x + 'px, ' + y + 'px)';\n                noButton.innerText = 'No, thanks!';\n                noButton.style.backgroundColor = '#' + Math.floor(Math.random()*16777215).toString(16);\n            }, 1000);\n            setTimeout(() => { clearInterval(moveButton); }, 10000);\n        });\n    <\/script>\n</body>\n</html>

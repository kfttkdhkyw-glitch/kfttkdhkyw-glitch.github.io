<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Day Celebration</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 100vh;
            background: pink;
            font-family: Arial, sans-serif;
        }
        .gradient-text {
            font-size: 48px;
            background: linear-gradient(to right, red, pink);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        #no-button {
            margin-top: 20px;
            padding: 10px 20px;
            border: 2px solid pink;
            background: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1 class="gradient-text">Happy Valentine's Day!</h1>
    <img src="https://example.com/valentine.gif" alt="Valentine Celebration" />
    <button id="no-button" onclick="changeTextAndColor()">No</button>
    <script>
        function changeTextAndColor() {
            const button = document.getElementById('no-button');
            button.innerText = 'Try Again!';
            button.style.backgroundColor = 'red';
            button.style.color = 'white';
        }
    </script>
</body>
</html>
